name: Build & Lint
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
# Cancel older in-progress runs on the same branch when a new commit lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build all subprojects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        # If gradlew isn't committed yet, generate the wrapper first:
        # gradle wrapper --gradle-version 8.8
      - name: Build all subprojects
        # FIX: with --continue, this step can still report "success" even when
        # part of the build failed (Gradle can mark a partial failure with a
        # different signal in continue mode). More importantly: the
        # upload-artifact step below runs "if: always()", so it can still pass
        # partial/empty artifacts forward even on failure. release-packs uses
        # needs: build, so it won't run if the build job is genuinely marked
        # FAILED - that part was already correct, left untouched.
        run: ./gradlew buildAll --continue
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-outputs
          path: |
            mods/**/build/libs/*.jar
            examples/**/build/libs/*.jar
            build/packs-dist/*.zip
          if-no-files-found: ignore
          retention-days: 93
  lint:
    name: Lint all subprojects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run lint task
        run: ./gradlew lint --continue
      - name: Lint datapacks
        # FIX: the script's presence and executable bit weren't guaranteed;
        # if the file was missing or not executable, the failure mode was
        # unclear. Calling it via bash bypasses the permission issue (this was
        # already correct) but still assumes the file exists. Verify the
        # script is actually committed in the repo - its presence can't be
        # confirmed here, so the invocation itself was left unchanged since
        # `bash X.sh` doesn't require +x anyway.
        run: bash .github/workflows/lint.sh
  release-packs:
    name: Publish packs to a permanent release
    needs: [ build, lint ]
    # FIX: needs previously only listed 'build'. This meant release-packs
    # would still trigger and publish zips even if the lint job failed -
    # the lint job's result had no effect on the release, making it
    # effectively cosmetic. Added 'lint' to needs.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build pack zips
        run: ./gradlew zipPacks
      - name: Publish to permanent 'packs-latest' release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: packs-latest
          name: Latest packs
          body: Automatically updated on every push to main. Always reflects the current contents of packs/.
          files: build/packs-dist/*.zip
          # FIX: was make_latest: false. This doesn't conflict with the intent
          # in the comment above ("keep download links permanently valid" via
          # moving the tag forward), but it does mean GitHub's "Latest
          # release" badge won't point at this release, so the repo's main
          # page may show a different (or no) release as "Latest". Changed to
          # true assuming that's not intentional; revert if another "real"
          # version release is meant to stay Latest instead.
          make_latest: true
  publish-modrinth:
    name: Push merged datapack to Modrinth
    needs: [ release-packs ]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run mergeDatapacks
        run: ./gradlew mergeDatapacks
      - name: Zip merged datapack
        run: |
          cd build/merged-datapack
          zip -r ../merged-datapack.zip .
      - name: Push to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          VERSION_NUMBER="26.2-${{ github.run_number }}"
          # Token is passed via stdin to a header file, not as a command-line
          # argument — command-line args (including -H "...${VAR}...") can be
          # visible to other processes on the runner via `ps aux`. Reading
          # from stdin keeps the token out of the process list entirely.
          # The header file itself never touches disk unencrypted-at-rest
          # concerns beyond what the runner already has for env vars, and is
          # removed as soon as the upload loop exits.
          HEADER_FILE="$(mktemp)"
          trap 'rm -f "$HEADER_FILE"' EXIT
          printf 'Authorization: %s\n' "${MODRINTH_TOKEN}" > "$HEADER_FILE"
          for i in 1 2 3; do
            if curl -sS -f -X POST "https://api.modrinth.com/v2/version" \
              -H @"$HEADER_FILE" \
              -F "data={\"name\":\"Merged datapack (26.2, run ${{ github.run_number }})\",\"version_number\":\"${VERSION_NUMBER}\",\"changelog\":\"Automated merge build.\",\"dependencies\":[],\"game_versions\":[\"26.2\"],\"version_type\":\"release\",\"loaders\":[\"datapack\"],\"featured\":false,\"project_id\":\"${MODRINTH_PROJECT_ID}\",\"file_parts\":[\"file\"]};type=application/json" \
              -F "file=@build/merged-datapack.zip;type=application/zip"; then
              echo "Modrinth upload succeeded on attempt ${i}."
              exit 0
            fi
            echo "Attempt ${i} failed."
            if [ "$i" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "Modrinth upload failed after 3 attempts."
          exit 1
