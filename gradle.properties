# Root-level Gradle settings for the runtoolkit/suite monorepo build.
#
# This file did not previously exist. In a multi-project Gradle build, the
# shared build daemon's JVM args come from the ROOT project's
# gradle.properties only - the org.gradle.jvmargs lines inside individual
# subprojects' own gradle.properties (e.g. mods/*/gradle.properties) are
# honored only when that subproject is built standalone as its own root,
# not when it's pulled into this monorepo via settings.gradle's
# auto-discovery. Without this file the daemon fell back to Gradle's
# default (512 MiB heap), which was enough when there were fewer Fabric
# Loom subprojects doing remapJar/remapSourcesJar in the same daemon, but
# started failing with OutOfMemoryError once another Loom subproject was
# added (see the datapack-blocker / rtwrapper-mod remapJar OOM failures).
#
# -Xmx4G is a conservative bump given GitHub-hosted runners typically have
# ~7 GB total RAM; adjust upward if more Loom subprojects are added later
# and this starts failing again.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
