name: Secret scan

# General-purpose guard that fails the build if anything that looks like a
# credential or access token is committed. No secrets are ever stored in this
# repository.


on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan tracked files for credentials and tokens
        run: |
          set -euo pipefail
          # Patterns for common token/credential formats.
          patterns='(ghp_[A-Za-z0-9]{30,})|(github_pat_[A-Za-z0-9_]{30,})|(gho_[A-Za-z0-9]{30,})|(ghs_[A-Za-z0-9]{30,})|(AKIA[0-9A-Z]{16})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|(xox[baprs]-[A-Za-z0-9-]+)|(AIza[0-9A-Za-z_-]{30,})'
          # Search only tracked files; exclude this workflow itself.
          files=$(git ls-files | grep -v '.github/workflows/secret-scan.yml' || true)
          if [ -z "$files" ]; then
            echo "No tracked files to scan."
            exit 0
          fi
          if echo "$files" | xargs -d '\n' grep -InE "$patterns" 2>/dev/null; then
            echo "::error::Potential secret detected in tracked files."
            exit 1
          fi
          echo "No secrets detected."
