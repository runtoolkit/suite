name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate all JSON files
        run: |
          echo "Checking JSON files..."
          failed=0
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON: $file"
              failed=1
            else
              echo "✅ $file"
            fi
          done < <(find data -name "*.json" -print0)
          if [ "$failed" -ne 0 ]; then
            echo "One or more JSON files failed validation."
            exit 1
          fi
          echo "All JSON files are valid."

  validate-mcfunction:
    name: Validate mcfunction files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check mcfunction syntax
        run: |
          echo "Checking .mcfunction files..."
          failed=0
          while IFS= read -r -d '' file; do
            # Reject bare 'true'/'false' as SNBT boolean values (must be 1b/0b)
            if grep -Pn '\b(true|false)\b' "$file"; then
              echo "❌ Possible SNBT boolean issue in: $file (use 1b/0b instead of true/false)"
              failed=1
            fi
            # Reject scoreboard objective names starting with '#'
            if grep -Pn 'scoreboard objectives add #' "$file"; then
              echo "❌ Objective name starts with '#' in: $file (not allowed since 26.1.x)"
              failed=1
            fi
            echo "✅ $file"
          done < <(find data -name "*.mcfunction" -print0)
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All mcfunction files passed checks."

  validate-pack-meta:
    name: Validate pack.mcmeta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check pack.mcmeta exists and is valid
        run: |
          if [ ! -f pack.mcmeta ]; then
            echo "❌ pack.mcmeta not found"
            exit 1
          fi
          python3 -m json.tool pack.mcmeta > /dev/null
          echo "✅ pack.mcmeta is valid JSON"

          pack_format=$(python3 -c "import json,sys; d=json.load(open('pack.mcmeta')); print(d['pack']['pack_format'])")
          echo "Pack format: $pack_format"
          if [ "$pack_format" -lt 48 ]; then
            echo "❌ pack_format must be >= 48 (Minecraft 1.21+)"
            exit 1
          fi
          echo "✅ pack_format is $pack_format (>= 48)"
