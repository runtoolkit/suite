# This is a basic workflow to help you get started with Actions
name: CI
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install mecha
        run: pip install mecha==0.101.0
      - name: Validate datapack
        run: mecha datapack/RTWrapper-Datapack
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mecha-report
          path: mecha-report.json
      - name: Create datapack ZIP
        run: |
          cd datapack/RTWrapper-Datapack
          zip -r ../${{ github.event.repository.name }}.zip . -x ".*"
      - name: Upload datapack artifact
        uses: actions/upload-artifact@v7
        with:
          name: datapack
          path: datapack/${{ github.event.repository.name }}.zip

  build-mod:
    # Fabric mod build/derleme adımı. Datapack job'undan bağımsız çalışır;
    # datapack tarafında hata olsa bile mod derlemesi ayrı raporlanır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Make gradlew executable
        run: chmod +x rtwrapper-fabric/gradlew
      - name: Build mod
        run: |
          cd rtwrapper-fabric
          ./gradlew build --no-daemon
      - name: Upload mod jar artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtwrapper-fabric-jar
          path: rtwrapper-fabric/build/libs/*.jar
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mod-build-reports
          path: rtwrapper-fabric/build/reports/
