name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build datapack zip
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="RunLoad-${VERSION}.zip"
          zip -r "$ZIP_NAME" data/ pack.mcmeta LICENSE README.md
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: RunLoad-${{ steps.version.outputs.VERSION }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RunLoad ${{ steps.version.outputs.VERSION }}"
          body: |
            ## RunLoad ${{ steps.version.outputs.VERSION }}

            > ⚠️ This is a fork/continuation of [LanternMC/load](https://github.com/LanternMC/load), maintained by [runtoolkit](https://github.com/runtoolkit).

            ### Installation
            Download the zip below and copy `data/load` and `data/minecraft` into your pack's `data/` folder.

            See [README.md](https://github.com/runtoolkit/load#readme) for full usage instructions.
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
