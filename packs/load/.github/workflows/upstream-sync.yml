name: Upstream Sync Check

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-upstream:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch upstream (LanternMC/load)
        run: |
          git remote add upstream https://github.com/LanternMC/load.git || true
          git fetch upstream main --depth=5 2>/dev/null || git fetch upstream master --depth=5 2>/dev/null || echo "Upstream fetch failed — repo may be private or renamed"

      - name: Compare init.mcfunction with upstream
        run: |
          UPSTREAM_FILE=$(git show upstream/main:data/load/function/_private/init.mcfunction 2>/dev/null \
            || git show upstream/master:data/load/function/_private/init.mcfunction 2>/dev/null \
            || echo "FETCH_FAILED")

          if [ "$UPSTREAM_FILE" = "FETCH_FAILED" ]; then
            echo "⚠️  Could not compare — upstream branch not reachable."
            exit 0
          fi

          LOCAL_FILE=$(cat data/load/function/_private/init.mcfunction)

          if [ "$UPSTREAM_FILE" = "$LOCAL_FILE" ]; then
            echo "✅ init.mcfunction is in sync with upstream."
          else
            echo "⚠️  init.mcfunction differs from upstream LanternMC/load."
            echo "Review and decide whether to incorporate upstream changes."
          fi
