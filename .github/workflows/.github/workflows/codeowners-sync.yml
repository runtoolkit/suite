# .github/workflows/codeowners-sync.yml
name: CODEOWNERS Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch members and generate CODEOWNERS
        env:
          # GitHub App token or fine-grained PAT (read:org / Members: read)
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          owners=$(gh api orgs/runtoolkit/members --paginate --jq '.[].login' | sed 's/^/@/' | tr '\n' ' ')
          [ -n "$owners" ] || { echo "Member list is empty, aborting"; exit 1; }
          cat > .github/CODEOWNERS <<EOF
          # This file is generated by the codeowners-sync workflow.
          /packs/.datapack-lock.json $owners
          /packs/*/data/*/function/_rt_origin.mcfunction $owners
          /packs/*/data/*/functions/_rt_origin.mcfunction $owners
          .github/CODEOWNERS $owners
          .github/workflows/ $owners
          EOF
          sed -i 's/^          //' .github/CODEOWNERS

      - name: Open PR (no merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- .github/CODEOWNERS; then
            echo "No changes"; exit 0
          fi
          git config user.name  "codeowners-sync[bot]"
          git config user.email "codeowners-sync@users.noreply.github.com"
          git checkout -B chore/codeowners-sync
          git add .github/CODEOWNERS
          git commit -m "chore: update CODEOWNERS owner list"
          git push -f origin chore/codeowners-sync
          gh pr create --base main --head chore/codeowners-sync \
            --title "chore: update CODEOWNERS owner list" \
            --body "Auto-generated. Owner list pulled from org members. Please review the list and merge." || true
