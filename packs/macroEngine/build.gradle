import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    gametest {
        java {
            srcDirs = ['src/gametest/java']
        }
        resources {
            srcDirs = ['src/gametest/resources']
        }
    }
}

afterEvaluate {
    configurations {
        gametestCompileClasspath.extendsFrom minecraftNamedCompile
        gametestRuntimeClasspath.extendsFrom minecraftNamedRuntime
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"

    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.2"

    gametestImplementation "net.fabricmc:fabric-loader:0.19.3"
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.2"
}

fabricApi {
    configureTests {
        createSourceSet = false
        modId = 'macroengine-testmod'
    }
}

loom {
    runs {
        gametest {
            inherit server
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/gametest"
        }
    }

    mods {
        "macroengine-testmod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

def TARGETS = [
    "full"   : 107,
    "1_20_5" : 41   // 1.20.5-1.20.6, uses the 1_20_5/data overlay
]

def macroEngineSrc = file("datapacks/macroEngine")
def extensionsSrc  = file("datapacks/macroengine_extensions")

def buildRoot = layout.buildDirectory.dir("datapack").get().asFile
def distRoot  = layout.buildDirectory.dir("dist").get().asFile

tasks.register("lintJson") {
    group = "verification"
    description = "Validates every *.json file parses as JSON"
    doLast {
        def slurper = new JsonSlurper()
        def failures = []
        fileTree(projectDir) {
            include "**/*.json"
            exclude ".git/**"
        }.each { f ->
            try {
                slurper.parse(f)
            } catch (Exception e) {
                failures << "${f}: ${e.message}"
            }
        }
        if (failures) {
            failures.each { logger.error("JSON error: ${it}") }
            throw new GradleException("${failures.size()} invalid JSON file(s) found.")
        }
        logger.lifecycle("All JSON files valid.")
    }
}

tasks.register("lintMcfunctionPrecheck") {
    group = "verification"
    description = "Scans *.mcfunction files for BOM, null bytes, CRLF"
    doLast {
        def errors = 0
        fileTree(projectDir) {
            include "**/*.mcfunction"
            exclude ".git/**"
        }.each { f ->
            byte[] bytes = f.bytes
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF) {
                logger.error("BOM detected: ${f}")
                errors++
            }
            if (bytes.any { it == 0 }) {
                logger.error("Null byte detected: ${f}")
                errors++
            }
            if (bytes.any { it == (byte) 0x0D }) {
                logger.error("CRLF line endings: ${f}")
                errors++
            }
        }
        if (errors > 0) {
            throw new GradleException("${errors} issue(s) found in .mcfunction files.")
        }
        logger.lifecycle("mcfunction pre-check passed.")
    }
}

tasks.register("lintMecha", Exec) {
    group = "verification"
    description = "Runs mecha against a patched scratch copy of the datapack"
    dependsOn "lintMcfunctionPrecheck"

    def scratch = layout.buildDirectory.dir("mecha-scratch").get().asFile

    doFirst {
        delete(scratch)
        mkdir(scratch)
        copy {
            from(projectDir) {
                exclude "build/**", ".git/**", ".github/**"
            }
            into(scratch)
        }

        fileTree(scratch) { include "**/*.mcfunction" }.each { f ->
            def text = f.getText("UTF-8")
            def patched = text
                .replaceAll(/([a-z0-9._-]+): _/, '$1:_')
                .replaceAll(/time of [a-z0-9_:.-]+ /, 'time ')
                .replace('time query day repetition', 'time query daytime')
            if (patched != text) {
                f.setText(patched, "UTF-8")
            }
        }

        ProcessBuilder pb = new ProcessBuilder("pip", "install", "-q", "git+https://github.com/mcbeet/mecha.git")
        pb.inheritIO()
        Process process = pb.start()
        process.waitFor()
    }

    workingDir = scratch
    commandLine "mecha", "."
}

tasks.register("lintPackMcmeta") {
    group = "verification"
    description = "Checks pack.mcmeta exists and is valid JSON for macroEngine and macroengine_extensions"
    doLast {
        [new File(macroEngineSrc, "pack.mcmeta"), new File(extensionsSrc, "pack.mcmeta")].each { meta ->
            if (!meta.exists()) {
                throw new GradleException("${meta} is missing!")
            }
            new JsonSlurper().parse(meta)
        }
        logger.lifecycle("pack.mcmeta files valid.")
    }
}

tasks.register("lint") {
    group = "verification"
    description = "Runs all datapack lint checks"
    dependsOn "lintJson", "lintMcfunctionPrecheck", "lintMecha", "lintPackMcmeta"
}

def buildTasks = []

TARGETS.each { label, packFormat ->
    def stageDir = new File(buildRoot, label)

    def prepareTask = tasks.register("prepare${label.capitalize()}") {
        group = "build"
        description = "Assembles the ${label} datapack variant into build/datapack/${label}"

        doLast {
            delete(stageDir)
            mkdir(stageDir)

            // FIX: 1_20_5/ overlay source klasoru artik base kopyadan haric tutuluyor.
            // Eskiden buradaki exclude olmadigi icin datapacks/macroEngine/1_20_5/**
            // stageDir/1_20_5/... olarak da kopyalaniyordu; asagidaki overlay copy'si
            // sadece stageDir/data/ uzerine yaziyordu ama base kopyada 1_20_5 klasoru
            // data/ ile ayni isim uzayinda bir namespace/klasorle cakisirsa (ör. bir
            // namespace'in adi "1_20_5" olsaydi ya da baska bir surec bu klasoru
            // data/ altina tasiyip birlestirseydi) override ile base içerik karisirdi.
            // Net kural: overlay kaynagi ASLA base kopyanin parcasi olmamali, sadece
            // explicit ikinci copy adimiyla data/ altina uygulanmali.
            copy {
                from(macroEngineSrc) {
                    exclude "1_20_5/**"
                }
                into(stageDir)
            }

            // 1_20_5 overlay: SADECE "1_20_5" (legacy, pack_format 41) hedefine uygulanir.
            // "full" hedefinde uygulanmaz — aksi halde en guncel pack_format'a eski
            // surum override'lari karisir ve geriye uyumluluk yamasi ileri surumu bozar.
            if (label == "1_20_5") {
                def overlay120_5 = new File(macroEngineSrc, "1_20_5/data")
                if (overlay120_5.exists()) {
                    copy {
                        from(overlay120_5)
                        into(new File(stageDir, "data"))
                    }
                }
            }

            def metaFile = new File(stageDir, "pack.mcmeta")
            def meta = new JsonSlurper().parse(metaFile)
            meta.pack.pack_format = packFormat
            metaFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(meta))
        }
    }

    def zipTask = tasks.register("zip${label.capitalize()}", Zip) {
        group = "build"
        description = "Packages the ${label} datapack variant as a zip artifact"
        dependsOn prepareTask
        from(stageDir)
        destinationDirectory.set(distRoot)
        archiveFileName.set("macroEngine-${label}.zip")
    }

    buildTasks << zipTask
}

def extensionsStageDir = new File(buildRoot, "extensions")

def prepareExtensionsTask = tasks.register("prepareExtensions") {
    group = "build"
    description = "Assembles macroengine_extensions into build/datapack/extensions"

    doLast {
        delete(extensionsStageDir)
        mkdir(extensionsStageDir)
        copy {
            from(extensionsSrc)
            into(extensionsStageDir)
        }
    }
}

def zipExtensionsTask = tasks.register("zipExtensions", Zip) {
    group = "build"
    description = "Packages macroengine_extensions as a zip artifact"
    dependsOn prepareExtensionsTask
    from(extensionsStageDir)
    destinationDirectory.set(distRoot)
    archiveFileName.set("macroengine_extensions.zip")
}

buildTasks << zipExtensionsTask

tasks.register("buildAll") {
    group = "build"
    description = "Builds every datapack variant (macroEngine + macroengine_extensions) and repacks each zip to pack.mcmeta + pack.png + data/ only"
    dependsOn buildTasks
    finalizedBy "repack"
}

tasks.register("repack") {
    group = "build"
    description = "Trims each dist zip to pack.mcmeta + data/ only, replacing the original"
    dependsOn buildTasks

    doLast {
        def scratch = layout.buildDirectory.dir("repack-scratch").get().asFile

        distRoot.listFiles({ f -> f.name.endsWith(".zip") } as FileFilter)?.each { zipFile ->
            def name = zipFile.name
            delete(scratch)
            mkdir(scratch)

            // FIX: "1_20_5/data/**" include'u silindi. Tek hedef "full" (pack_format 107),
            // nihai zip'te boyle bir klasor OLMAMALI. Bu satir eskiden overlay kaynagindan
            // artakalan dosyalari (eger prepare adiminda base kopyaya karismislarsa) sessizce
            // zip'e tasiyip, gercek datapack yapisini bozan "1_20_5/" adinda gecersiz bir
            // ust klasor birakabiliyordu. Artik repack sadece gercekten var olmasi gereken
            // pack.mcmeta + pack.png + data/ icerigini aliyor.
            copy {
                from(zipTree(zipFile)) {
                    include "pack.mcmeta"
                    include "pack.png"
                    include "data/**"
                }
                into(scratch)
            }

            if (!new File(scratch, "pack.mcmeta").exists()) {
                throw new GradleException("${name}: pack.mcmeta missing after filtering — refusing to repack.")
            }

            delete(zipFile)

            ant.zip(destfile: zipFile, basedir: scratch)

            logger.lifecycle("Repacked ${name} -> pack.mcmeta + data/ only")
        }
    }
}

tasks.register("release") {
    group = "publish"
    description = "Creates/updates the GitHub release for the full build"
    dependsOn "zipFull", "repack"

    doLast {
        def metaFile = new File(buildRoot, "full/pack.mcmeta")
        def meta = new JsonSlurper().parse(metaFile)
        def desc = meta.pack.description

        String version = null
        if (desc instanceof List) {
            desc.each { entry ->
                if (entry instanceof Map && entry.text) {
                    def m = (entry.text =~ /^\s*\|\s*(v[0-9][^\s]*)/)
                    if (m.find()) version = m.group(1)
                }
            }
        } else if (desc instanceof String) {
            def m = (desc =~ /v[\d.]+/)
            if (m.find()) version = m.group(0)
        }
        version = version ?: "latest"

        def zip = new File(distRoot, "macroEngine-full.zip")

        providers.exec { commandLine "bash", "-c", "gh release delete '${version}' --yes 2>/dev/null || true" }.result.get()
        providers.exec { commandLine "bash", "-c", "git push origin ':refs/tags/${version}' 2>/dev/null || true" }.result.get()
        providers.exec {
            commandLine "gh", "release", "create", version,
                "--title", "MacroEngine ${version}",
                "--notes", "**Datapack build** (pack_format 107).",
                "--latest",
                "${zip}#macroEngine-full.zip"
        }.result.get()
        logger.lifecycle("Released ${version}")
    }
}

tasks.register('createSourceArchive', Copy) {
    description = 'Copies project files into the archive directory, excluding .git'
    from(rootDir) {
        exclude 'archive/**'
        exclude '.github/**'
        exclude '.git/**'
    }
    into layout.buildDirectory.dir('archive/source')
}

tasks.register('copyGitHistory', Copy) {
    description = 'Copies git history into the archive directory'
    dependsOn createSourceArchive
    from(rootDir) {
        include '.git/**'
    }
    into layout.buildDirectory.dir('archive/source')
}

tasks.register('createSourceZip', Zip) {
    description = 'Creates source-with-history.zip'
    dependsOn copyGitHistory
    from layout.buildDirectory.dir('archive/source')
    archiveFileName = 'source-with-history.zip'
    destinationDirectory = layout.buildDirectory.dir('archive')
}

tasks.register("runMainTestClient", JavaExec) {
    group = "verification"
    description = "Runs Main.java Test Client standalone"
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = "io.runtoolkit.macroengine.Main"
}