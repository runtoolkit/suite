// Root build.gradle - shared lint/build tasks for all subprojects
allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
    }
}

tasks.register('lint') {
    group = 'verification'
    description = 'Runs checkstyle across all subprojects where configured.'
    // FIX: real task dependency instead of manually invoking action.execute().
    // This makes up-to-date checks, the task graph, and logging work correctly.
    dependsOn subprojects.collect { sub -> sub.tasks.matching { it.name == 'checkstyleMain' } }
    doLast {
        println "Lint completed (ran checkstyleMain where present)."
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all subprojects.'
    // FIX: use lazy provider instead of eager .collect{} at configuration time,
    // so this doesn't fail if a subproject doesn't have a 'build' task yet.
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'build' } }
}

// ---------------------------------------------------------------------------
// zipPacks: finds every folder under packs/ containing a pack.mcmeta
// (datapack or resource pack, data/ and/or assets/) and zips each one
// independently into build/packs-dist/<folder-name>.zip
// ---------------------------------------------------------------------------
tasks.register('zipPacks') {
    group = 'build'
    description = 'Zips every pack.mcmeta-containing folder under packs/ into build/packs-dist/'
    def packsRoot = file('packs')
    def outDir = file('build/packs-dist')
    doLast {
        outDir.mkdirs()
        if (!packsRoot.exists()) {
            println "No packs/ directory found, skipping."
            return
        }
        def packDirs = []
        packsRoot.eachFileRecurse { f ->
            // FIX: exclude pack.mcmeta files accidentally nested under build/ or
            // similar output folders (e.g. a copy extracted from a previous zip),
            // otherwise duplicate/dirty zips get produced.
            if (f.name == 'pack.mcmeta' && !f.path.contains("${File.separator}build${File.separator}")) {
                packDirs << f.parentFile
            }
        }
        if (packDirs.isEmpty()) {
            println "No pack.mcmeta files found under packs/."
            return
        }
        packDirs.each { dir ->
            def relPath = packsRoot.toPath().relativize(dir.toPath()).toString()
            def safeName = relPath.replace(File.separator, '-').replace('/', '-')
            def zipName = "${safeName}.zip"
            def zipFile = new File(outDir, zipName)
            println "Zipping ${dir} -> build/packs-dist/${zipName}"
            ant.zip(destfile: zipFile.absolutePath, basedir: dir.absolutePath)
        }
        println "Done: ${packDirs.size()} pack(s) zipped into ${outDir}"
    }
}

// Make zipPacks run as part of the normal build
tasks.named('buildAll') { dependsOn 'zipPacks' }

// ---------------------------------------------------------------------------
// NEW 1: checkPacks - validates before build that every pack.mcmeta is valid
// JSON and declares a format field.
// ---------------------------------------------------------------------------
tasks.register('checkPacks') {
    group = 'verification'
    description = 'Validates that every pack.mcmeta under packs/ is valid JSON and declares a format (pack_format, or min_format/max_format for 1.21.9+).'
    def packsRoot = file('packs')
    doLast {
        if (!packsRoot.exists()) {
            println "No packs/ directory found, skipping."
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        def errors = []
        packsRoot.eachFileRecurse { f ->
            if (f.name == 'pack.mcmeta' && !f.path.contains("${File.separator}build${File.separator}")) {
                try {
                    def parsed = slurper.parse(f)
                    def pack = parsed?.pack
                    // FIX: 1.21.9+ pack.mcmeta uses min_format/max_format instead of
                    // pack_format (see minecraft-versions notes). Since 26.x is the
                    // target, either form must be accepted, otherwise current
                    // dataLib-dp packs get flagged as false positives.
                    def hasLegacyFormat = pack?.pack_format != null
                    def hasNewFormat = pack?.min_format != null && pack?.max_format != null
                    if (!hasLegacyFormat && !hasNewFormat) {
                        errors << "${f}: neither 'pack.pack_format' nor 'pack.min_format'+'max_format' present"
                    }
                } catch (Exception e) {
                    errors << "${f}: invalid JSON - ${e.message}"
                }
            }
        }
        if (errors) {
            errors.each { println "ERROR: ${it}" }
            throw new GradleException("checkPacks failed: ${errors.size()} problematic pack.mcmeta file(s) found.")
        }
        println "checkPacks OK: all pack.mcmeta files are valid."
    }
}
// Require validation before zipPacks
tasks.named('zipPacks') { dependsOn 'checkPacks' }

// ---------------------------------------------------------------------------
// NEW 2: printPackList - lists every pack folder found under packs/ (without
// zipping anything); for debug/CI logging.
// ---------------------------------------------------------------------------
tasks.register('printPackList') {
    group = 'help'
    description = 'Lists every detected pack folder under packs/ without zipping anything.'
    def packsRoot = file('packs')
    doLast {
        if (!packsRoot.exists()) {
            println "No packs/ directory found."
            return
        }
        def found = []
        packsRoot.eachFileRecurse { f ->
            if (f.name == 'pack.mcmeta' && !f.path.contains("${File.separator}build${File.separator}")) {
                found << packsRoot.toPath().relativize(f.parentFile.toPath()).toString()
            }
        }
        if (found.isEmpty()) {
            println "No packs found."
        } else {
            println "Detected ${found.size()} pack(s):"
            found.sort().each { println " - ${it}" }
        }
    }
}

// ---------------------------------------------------------------------------
// mergeDatapacks: reads packs/merge-manifest.json and merges the listed
// pack folders under packs/ into a single output datapack at
// build/merged-datapack/. Non-JSON files are copied straight through.
// Colliding files are handled explicitly, never silently overwritten:
//   - data/minecraft/tags/function(s)/{load,tick}.json (and any other
//     tags/function(s)/*.json) are merged by unioning their "values"
//     arrays, since every pack's load/tick hook lives there and a plain
//     copy would let the last pack processed clobber every other pack's
//     hook (verified collision: 6 of 7 packs in this repo write to
//     minecraft:load/minecraft:tick).
//   - any other file path that appears in more than one included pack
//     fails the build loudly, since there's no generically safe way to
//     merge two different function/loot_table/etc. files.
// pack_format mismatches across included packs also fail the build
// unless the manifest sets "allowMismatchedFormats": true, because
// packs in this repo span pack_format 10-101 (roughly MC 1.16-1.21.9+)
// and silently merging across that range produces a broken pack.
// ---------------------------------------------------------------------------
tasks.register('mergeDatapacks') {
    group = 'build'
    description = 'Merges the packs listed in packs/merge-manifest.json into build/merged-datapack/.'
    def packsRoot = file('packs')
    def manifestFile = file('packs/merge-manifest.json')
    def outDir = file('build/merged-datapack')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("mergeDatapacks failed: packs/merge-manifest.json not found. Create it with { \"output\": {...}, \"include\": [...] }.")
        }
        def slurper = new groovy.json.JsonSlurper()
        def manifest
        try {
            manifest = slurper.parse(manifestFile)
        } catch (Exception e) {
            throw new GradleException("mergeDatapacks failed: packs/merge-manifest.json is not valid JSON - ${e.message}")
        }

        def include = manifest.include ?: []
        def exclude = (manifest.exclude ?: []) as Set
        def output = manifest.output ?: [:]
        def allowMismatchedFormats = manifest.allowMismatchedFormats == true

        if (include.isEmpty()) {
            throw new GradleException("mergeDatapacks failed: manifest 'include' list is empty. Nothing to merge.")
        }

        def packDirs = [:]
        include.each { packName ->
            if (exclude.contains(packName)) {
                println "Skipping ${packName}: listed in manifest 'exclude'."
                return
            }
            // 'include' entries may be a top-level packs/<name> dir, or a
            // relative sub-path like 'dataLib-dp/datapacks/dataLib' for
            // datapacks nested inside a mod/tooling repo folder.
            def dir = new File(packsRoot, packName)
            if (!dir.exists() || !new File(dir, 'pack.mcmeta').exists()) {
                throw new GradleException("mergeDatapacks failed: packs/${packName} not found or has no pack.mcmeta.")
            }
            packDirs[packName] = dir
        }

        if (packDirs.isEmpty()) {
            throw new GradleException("mergeDatapacks failed: every entry in 'include' was excluded or missing.")
        }

        // Validate pack_format compatibility before touching any files.
        // Normalize to the actual numeric format(s) so a pack declaring
        // pack_format=107 and a pack declaring min_format=107/max_format=107
        // are recognized as the same format instead of compared as strings.
        def formats = [:]
        def normFormats = [:]
        packDirs.each { packName, dir ->
            def meta = slurper.parse(new File(dir, 'pack.mcmeta'))
            def pack = meta?.pack
            def fmt = pack?.pack_format != null ? "pack_format=${pack.pack_format}" : "min=${pack?.min_format} max=${pack?.max_format}"
            formats[packName] = fmt
            def minF = pack?.min_format != null ? pack.min_format : pack?.pack_format
            def maxF = pack?.max_format != null ? pack.max_format : pack?.pack_format
            normFormats[packName] = [minF, maxF]
        }
        def distinctFormats = normFormats.values().toSet()
        if (distinctFormats.size() > 1 && !allowMismatchedFormats) {
            def details = formats.collect { k, v -> "  - ${k}: ${v}" }.join('\n')
            throw new GradleException(
                "mergeDatapacks failed: included packs declare different pack_format values, merging them " +
                "produces a datapack that is broken for at least one of them:\n${details}\n" +
                "Set \"allowMismatchedFormats\": true in the manifest to merge anyway (not recommended)."
            )
        }

        if (outDir.exists()) {
            outDir.deleteDir()
        }
        outDir.mkdirs()

        // Collect every relative file path across all included packs so we
        // can detect collisions before writing anything.
        def relPathToSources = [:]
        packDirs.each { packName, dir ->
            dir.eachFileRecurse { f ->
                if (f.isFile()) {
                    def rel = dir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                    // pack.mcmeta, README, LICENSE, etc. at pack root are per-pack
                    // metadata, not merged content - skip them explicitly.
                    if (!rel.contains('/')) {
                        return
                    }
                    relPathToSources.computeIfAbsent(rel) { [] } << [pack: packName, file: f]
                }
            }
        }

        // Paths where a tags/function(s)/*.json union-merge applies.
        def isFunctionTagFile = { String rel ->
            (rel ==~ /data\/[^\/]+\/tags\/function\/.+\.json/) ||
            (rel ==~ /data\/[^\/]+\/tags\/functions\/.+\.json/)
        }

        def hardCollisions = []
        relPathToSources.each { rel, sources ->
            if (sources.size() > 1 && !isFunctionTagFile(rel)) {
                hardCollisions << "${rel} (in: ${sources.collect { it.pack }.join(', ')})"
            }
        }
        if (hardCollisions) {
            throw new GradleException(
                "mergeDatapacks failed: the following files exist in more than one included pack " +
                "and cannot be safely merged automatically:\n" +
                hardCollisions.collect { "  - ${it}" }.join('\n') +
                "\nResolve the conflict manually (rename/remove in one pack) and re-run."
            )
        }

        // Write everything out.
        relPathToSources.each { rel, sources ->
            def outFile = new File(outDir, rel)
            outFile.parentFile.mkdirs()
            if (sources.size() == 1) {
                outFile.bytes = sources[0].file.bytes
            } else {
                // Union-merge tags/function(s) files by combining "values".
                def mergedValues = [] as LinkedHashSet
                def replaceFlag = false
                sources.each { src ->
                    def parsed = slurper.parse(src.file)
                    (parsed.values ?: []).each { mergedValues << it }
                    if (parsed.replace == true) {
                        replaceFlag = true
                    }
                }
                def mergedJson = groovy.json.JsonOutput.toJson([
                    replace: replaceFlag,
                    values : mergedValues.toList()
                ])
                outFile.text = groovy.json.JsonOutput.prettyPrint(mergedJson)
                println "Merged ${rel} <- ${sources.collect { it.pack }.join(', ')} (${mergedValues.size()} value(s))"
            }
        }

        // Write the merged pack.mcmeta from the manifest's "output" block.
        // pack_format is optional as of 25w31a (data pack format 82+ / resource
        // pack 65+); min_format+max_format are the required pair for that range.
        // Support whichever the manifest provides; fail if neither is given.
        def outPack = [description: output.description ?: "Merged datapack (${packDirs.keySet().join(', ')})"]
        if (output.pack_format != null) {
            outPack.pack_format = output.pack_format
        }
        if (output.min_format != null && output.max_format != null) {
            outPack.min_format = output.min_format
            outPack.max_format = output.max_format
        }
        if (output.pack_format == null && (output.min_format == null || output.max_format == null)) {
            throw new GradleException(
                "mergeDatapacks failed: manifest 'output' must declare either 'pack_format' " +
                "(pre-82/legacy) or both 'min_format' and 'max_format' (required for 82+)."
            )
        }
        def outMeta = [pack: outPack]
        new File(outDir, 'pack.mcmeta').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(outMeta))

        println "mergeDatapacks OK: merged ${packDirs.size()} pack(s) -> ${outDir}"
        println "Included: ${packDirs.keySet().join(', ')}"
    }
}

// ---------------------------------------------------------------------------
// NEW 3: extend the clean task so it also removes the packs-dist output.
// (The default 'clean' already deletes build/, but this makes sure the
// packs-dist cleanup happens explicitly regardless of how the project
// overrides 'clean'.)
// ---------------------------------------------------------------------------
tasks.matching { it.name == 'clean' }.configureEach {
    doLast {
        def outDir = file('build/packs-dist')
        if (outDir.exists()) {
            outDir.deleteDir()
            println "Cleaned build/packs-dist/"
        }
    }
}
