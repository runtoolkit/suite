name: Validate data pack

# Lightweight checks: pack.mcmeta is valid JSON, all .json files parse, and the
# branch generator runs cleanly.


on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate JSON files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for path in glob.glob("**/*.json", recursive=True) + ["pack.mcmeta"]:
              try:
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
              except FileNotFoundError:
                  continue
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("All JSON files are valid.")
          PY

      - name: Smoke-test the generator
        run: |
          set -euo pipefail
          if [ -f tools/build_versions.py ]; then
            for target in 1.21.6 1.21.4 1.21.1 1.20.4; do
              python3 tools/build_versions.py "$target"
            done
          elif [ -f tools/build_1_19_2.py ]; then
            python3 tools/build_1_19_2.py
          else
            echo "::error::No known TunnelScript build generator found."
            exit 1
          fi
          # Leave the working tree clean; the build is reproducible.
          git checkout -- . || true
